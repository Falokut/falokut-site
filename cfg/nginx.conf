server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA-fallback (сайт одностраничный, маршрутизация по якорям —
    # запасной путь на случай, если появятся hash-free роуты).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Ассеты vite — хеши в имени, можно кешировать надолго.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Движок Stockfish (WASM + loader): версия в имени не меняется,
    # кешируем надолго; явный MIME, чтобы wasm стримился корректно.
    location /stockfish/ {
        types {
            application/wasm wasm;
            application/javascript js;
        }
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
