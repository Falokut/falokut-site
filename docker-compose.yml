services:
  site:
    build: .
    image: falokut-site:latest
    container_name: falokut-site
    restart: always
    labels:
      - "traefik.enable=true"
      # Основной роутер: apex + www; серт Let's Encrypt на оба имени (SAN)
      - "traefik.http.routers.site.rule=Host(`falokut.ru`) || Host(`www.falokut.ru`)"
      - "traefik.http.routers.site.priority=1"
      - "traefik.http.routers.site.tls=true"
      - "traefik.http.routers.site.entrypoints=web,websecure"
      - "traefik.http.routers.site.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.site.middlewares=site-hsts"
      # www -> apex: 301 permanent (выигрывает по priority)
      - "traefik.http.routers.site-www.rule=Host(`www.falokut.ru`)"
      - "traefik.http.routers.site-www.priority=2"
      - "traefik.http.routers.site-www.tls=true"
      - "traefik.http.routers.site-www.entrypoints=web,websecure"
      - "traefik.http.routers.site-www.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.site-www.middlewares=site-www-redirect"
      - "traefik.http.middlewares.site-www-redirect.redirectHost.backend=falokut.ru"
      - "traefik.http.middlewares.site-www-redirect.redirectHost.scheme=https"
      - "traefik.http.middlewares.site-www-redirect.redirectHost.permanent=true"
      # HSTS — как в n8n-compose
      - "traefik.http.middlewares.site-hsts.headers.STSSeconds=315360000"
      - "traefik.http.middlewares.site-hsts.headers.STSIncludeSubdomains=true"
      - "traefik.http.middlewares.site-hsts.headers.SSLHost=falokut.ru"
      - "traefik.http.middlewares.site-hsts.headers.SSLRedirect=true"

# сайт вешается на ту же сеть, где живёт traefik из n8n-compose
networks:
  default:
    external: true
    name: n8n-compose_default
