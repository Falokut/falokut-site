services:
  site:
    build: .
    image: falokut-site:latest
    container_name: falokut-site
    restart: always
    labels:
      - "traefik.enable=true"
      # Основной роутер: apex + www; серт Let's Encrypt на оба имени (SAN)
      - "traefik.http.routers.site.rule=Host(`falokut.ru`) || Host(`www.falokut.ru`)"
      - "traefik.http.routers.site.priority=1"
      - "traefik.http.routers.site.tls=true"
      - "traefik.http.routers.site.entrypoints=web,websecure"
      - "traefik.http.routers.site.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.site.middlewares=site-hsts"
      # www -> apex: 301 permanent (выигрывает по priority)
      - "traefik.http.routers.site-www.rule=Host(`www.falokut.ru`)"
      - "traefik.http.routers.site-www.priority=2"
      - "traefik.http.routers.site-www.tls=true"
      - "traefik.http.routers.site-www.entrypoints=web,websecure"
      - "traefik.http.routers.site-www.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.site-www.middlewares=site-www-redirect"
      # v3 OSS: redirectHost/replaceHost не существуют — только redirectRegex
      # (\\ — экранирование YAML, $$ — escape интерполяции compose)
      - "traefik.http.middlewares.site-www-redirect.redirectRegex.regex=^https?://www\\.falokut\\.ru/(.*)$"
      - "traefik.http.middlewares.site-www-redirect.redirectRegex.replacement=https://falokut.ru/$${1}"
      - "traefik.http.middlewares.site-www-redirect.redirectRegex.permanent=true"
      # HSTS — STS-заголовки на HTTPS-ответах (как в n8n-compose)
      - "traefik.http.middlewares.site-hsts.headers.STSSeconds=315360000"
      - "traefik.http.middlewares.site-hsts.headers.STSIncludeSubdomains=true"
      # HTTP -> HTTPS: отдельный НЕ-TLS роутер на web (80). Роутер с
      # tls=true обслуживает только HTTPS-запросы, поэтому на http он
      # не матчится и без этого роутера http отдавал бы 404.
      # (SSLRedirect в v3 из headers-мидлваря убран — redirectScheme.)
      - "traefik.http.routers.site-http.rule=Host(`falokut.ru`) && !PathPrefix(`/.well-known/acme-challenge`) || Host(`www.falokut.ru`) && !PathPrefix(`/.well-known/acme-challenge`)"
      - "traefik.http.routers.site-http.entrypoints=web"
      - "traefik.http.routers.site-http.priority=100"
      - "traefik.http.routers.site-http.middlewares=site-https-redirect"
      - "traefik.http.middlewares.site-https-redirect.redirectScheme.scheme=https"
      - "traefik.http.middlewares.site-https-redirect.redirectScheme.permanent=true"

# сайт вешается на ту же сеть, где живёт traefik из n8n-compose
networks:
  default:
    external: true
    name: n8n-compose_default
